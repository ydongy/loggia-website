name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: i18n, build, diff, site, facts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: i18n consistency
        run: python3 scripts/sitekit/check_i18n.py

      - name: Build
        run: python3 scripts/build.py

      - name: Committed output matches sources
        run: |
          git diff --exit-code -- public/ || {
            echo "::error::public/ is stale; run scripts/build.py and commit the result"; exit 1; }

      - name: Site check
        run: python3 scripts/sitekit/check_site.py

      - name: Legal facts
        run: python3 scripts/check_facts.py
